<!doctype html>
<meta charset="utf-8">
<style>
  body { font: 14px system-ui; padding: 20px; background: #f5f5f5; }
  .row { display: flex; gap: 40px; flex-wrap: wrap; }
  .wrap { position: relative; display: inline-block; }
  .wrap img { display: block; width: 500px; }
  .box { position: absolute; border: 2px solid #e00; }
  .box span { position: absolute; top: -17px; left: -2px; background: #e00;
              color: #fff; font: 11px system-ui; padding: 1px 5px; white-space: nowrap; }
  h3 { margin: 0 0 8px; }
</style>

<div class="row">
  <div>
    <h3>A — x, y, width, height</h3>
    <div class="wrap"><img src="/storage/images/2026/08/chz39hGr41ZN6P8FtlhULkKgVAhHdjjRZmdg2edU.jpg"><div id="a"></div></div>
  </div>
  <div>
    <h3>B — x1, y1, x2, y2</h3>
    <div class="wrap"><img src="/storage/images/2026/08/chz39hGr41ZN6P8FtlhULkKgVAhHdjjRZmdg2edU.jpg"><div id="b"></div></div>
  </div>
</div>

<script>
const objects = [
  { label: 'pen',            x: 395, y: 591, w: 605,  h: 300  },
  { label: 'notebook',       x: 105, y: 328, w: 895,  h: 672  },
  { label: 'wooden surface', x: 0,   y: 0,   w: 1000, h: 1000 },
];

const draw = (el, fn) =>
  document.getElementById(el).innerHTML = objects.map(o => {
    const [l, t, w, h] = fn(o);
    return `<div class="box" style="left:${l/10}%;top:${t/10}%;width:${w/10}%;height:${h/10}%">
              <span>${o.label}</span></div>`;
  }).join('');

draw('a', o => [o.x, o.y, o.w, o.h]);
draw('b', o => [o.x, o.y, o.w - o.x, o.h - o.y]);
</script>
